<div class="toolbar" id="toolbar">
  <div class="list-footer" id="document-list-footer">
    <div class="list-total">
      Tổng:
      <span class="list-chip" id="document-list-total">0</span>
      |
      Chọn:
      <span class="list-chip" id="document-list-selected">0</span>
    </div>
  </div>

  <div class="search-doc">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search..." />
      <button class="search-btn">🔍</button>
    </div>
  </div>

  <div class="receivable-actions" id="list-actions" title="Thao tác"></div>

  <div class="date-filter">
    <span>Từ ngày:</span>
    <input id="from-date" placeholder="yyyy-mm-dd">
  </div>

  <div class="date-filter">
    <span>Đến ngày:</span>
    <input id="to-date" placeholder="yyyy-mm-dd">
  </div>
</div>

<div class="list-page">
  <table>
    <thead id="document-list-head"></thead>
    <tbody id="document-list-body"></tbody>
  </table>

  <div class="list-summary">
    <strong>Tổng phát sinh:</strong>
    <span id="summary-total-money">0</span>
    <span>|</span>
    <strong id="summary-label">Còn nợ:</strong>
    <span id="summary-total-value">0</span>
    <span id="summary-selected" hidden>| <strong>Đã chọn:</strong> <span id="summary-selected-value">0</span></span>
  </div>

  <div id="receivable-payment-history" class="receivable-payment-history"></div>
</div>
